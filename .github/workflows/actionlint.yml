name: actionlint

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provide the linters actionlint shells out to
        run: |
          set -eu
          install=""
          command -v pipx >/dev/null 2>&1 || install=yes
          command -v shellcheck >/dev/null 2>&1 || install=yes
          if [ -n "$install" ]; then
            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends pipx shellcheck
            else
              echo "::warning::pipx/shellcheck absent and no apt-get here; actionlint will attempt its own install"
            fi
          fi
      - uses: raven-actions/actionlint@v2
