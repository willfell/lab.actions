name: lab-tools
description: Arch-aware installer for the fleet's k8s and registry tooling; installs the requested tools to $RUNNER_TEMP/bin and appends it to GITHUB_PATH
inputs:
  tools:
    description: Comma-separated subset of kubectl,kustomize,crane,kubeconform,helm
    required: true
  kubectl_version:
    description: kubectl release installed when kubectl is requested
    default: v1.35.0
  kustomize_version:
    description: kustomize release installed when kustomize is requested
    default: v5.7.1
  crane_version:
    description: go-containerregistry release installed when crane is requested
    default: v0.20.6
  kubeconform_version:
    description: kubeconform release installed when kubeconform is requested
    default: v0.7.0
  helm_version:
    description: helm release installed when helm is requested; empty installs the latest
    default: ""
runs:
  using: composite
  steps:
    - name: Install requested tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        KUBECTL_VERSION: ${{ inputs.kubectl_version }}
        KUSTOMIZE_VERSION: ${{ inputs.kustomize_version }}
        CRANE_VERSION: ${{ inputs.crane_version }}
        KUBECONFORM_VERSION: ${{ inputs.kubeconform_version }}
        HELM_VERSION: ${{ inputs.helm_version }}
      run: |
        "${{ github.action_path }}/../scripts/install-tools.sh" "$TOOLS"
